# Real-chain e2e for token-deployer-ui — TESTNET ONLY.
#
# MANUAL ONLY (workflow_dispatch). These runs publish a REAL testnet token / store a REAL testnet blob
# and spend testnet SUI (and WAL), so they never run on push or pull_request. The job runs in the
# `realchain` environment (deployments from `main` only). The automatic gates stay in node-ci.yml
# (`npm test` + the mocked Playwright suite).
#
# Mainnet is deliberately not offered here: no mainnet key is ever stored in CI. A mainnet run is
# done from the maintainer's machine with `E2E_MAINNET_CONFIRM=1 npm run e2e:mainnet` (README).
#
# Secrets (environment `realchain`):
#   SUI_PRIV_TESTNET     — bech32 suiprivkey1… for a minimally funded testnet key.
#   FEE_TREASURY_TESTNET — operator treasury address (fee recipient).
#   RPC_TESTNET (optional) — gRPC endpoint override (defaults to the public fullnode).

name: token-deployer real-chain e2e

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Harness to run on testnet (walrus = icon upload through the public relay)
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - walrus

permissions:
  contents: read

concurrency:
  group: realchain-e2e
  cancel-in-progress: false

jobs:
  realchain-e2e:
    runs-on: ubuntu-latest
    environment: realchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real-chain e2e (testnet)
        env:
          SUI_PRIV: ${{ secrets.SUI_PRIV_TESTNET }}
          VITE_FEE_TREASURY_TESTNET: ${{ secrets.FEE_TREASURY_TESTNET }}
          VITE_RPC_TESTNET: ${{ secrets.RPC_TESTNET }}
          E2E_RPC: ${{ secrets.RPC_TESTNET }}
          E2E_FEE_ADDR: ${{ secrets.FEE_TREASURY_TESTNET }}
          SUITE: ${{ inputs.suite }}
        run: |
          if [ "$SUITE" = walrus ]; then
            npm run e2e:walrus
          else
            npm run e2e:testnet
          fi
