name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v6.5.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm test

      - name: Build (dev — treasury guard bypassed for CI)
        run: VITE_ALLOW_UNSET_TREASURY=1 npm run build
