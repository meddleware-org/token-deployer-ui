name: Node CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run type-check

      - name: Lint CSS (stylelint)
        run: npm run lint:css --if-present

      - name: Lint JS (eslint + vuejs-a11y)
        run: npm run lint:js --if-present

      - name: Lint HTML (html-validate)
        run: npm run lint:html --if-present

      - name: Unit tests
        run: npm test

      - name: Build (dev — treasury guard bypassed for CI)
        run: VITE_ALLOW_UNSET_TREASURY=1 npm run build

      - name: Check the bundle carries no e2e harness
        run: npm run check:bundle

  e2e:
    name: Mocked UI e2e (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run mocked e2e (builds with `npm run build:e2e`)
        run: npm run test:e2e
